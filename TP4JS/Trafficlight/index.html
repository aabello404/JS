<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic light</title>
    <link rel="stylesheet" href="allcss.css">
</head>
<body>
    <div class="container">
        <div class="light">
            <div class="circle">
                <img src="emptylight.png" alt="" id="red">
            </div>
            <div class="circle">
                <img src="emptylight.png" alt="" id="yellow" >
            </div>
            <div class="circle">
               <img src="emptylight.png" alt="" id="green">
            </div>
            
        </div>
        <div>
            <button type="button" class="btnstart">Start</button>
            <button type="button" class="btnstop">Stop</button>
        </div>
    </div>
    <script src="trafficlight.js"></script>
    
</body>
</html>
